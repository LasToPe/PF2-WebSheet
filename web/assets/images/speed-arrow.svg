<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <!-- Arrow path definition for reuse -->
    <path id="arrow-shape" d="
      M 45 80 
      L 300 80 
      L 310 25 
      L 458 175 
      L 274 328 
      L 288 255 
      L 24 255 
      Z" 
    />
  </defs>

  <!-- Outer black border -->
  <use href="#arrow-shape" 
       fill="none" 
       stroke="#000000" 
       stroke-width="15" 
       stroke-linejoin="miter" 
       stroke-miterlimit="6" />

  <!-- Inner dark brown band -->
  <use href="#arrow-shape" 
       fill="#ffffff" 
       stroke="#6f473e" 
       stroke-width="5" 
       stroke-linejoin="miter" 
       stroke-miterlimit="6" />
</svg>