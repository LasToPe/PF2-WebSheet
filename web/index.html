<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="./styles/page.css" />
    <link rel="stylesheet" href="./styles/main.css" />

    <title>title</title>
</head>

<body>
    <page>
        <!--General information section-->
        <div id="general-information">
            <div id="sheet-logo">
                <img src="./assets/images/PF2Logo.png" alt="pathfinder second edition logo."/>
                <span>Character Sheet</span>
            </div>

            <div id="name-block">
                <span class="block-heading">
                    <span class="header-text">Character Name</span>
                    <span class="header-line"></span>
                </span>
                <span class="container-input">
                    <input id="character-name" type="text">
                </span>
                <span class="container-input secondary">
                    <span id="player-name-assistive-text">Player Name</span>
                    <input type="text">
                </span>
            </div>

            <div id="level-and-hero-points">
                <div id="level-block">
                    <span class="block-heading">
                        <span class="header-text">Level</span>
                        <span class="header-line"></span>
                    </span>
                    <div id="level-and-xp">
                        <span id="level-container">
                            <input type="number" min="1" max="20">
                        </span>
                        <span id="xp-container">
                            <input type="number">
                        </span>
                    </div>
                </div>
    
                <div id="hero-point-block">
                    <span class="block-heading">
                        <span class="header-text">Hero Points</span>
                        <span class="header-line"></span>
                    </span>
                    <div id="hero-point-fields">
                        <span class="hero-point-hexagon">
                            <input type="checkbox" id="hero-point-1">
                            <label for="hero-point-1"></label>
                        </span>
                        <span class="hero-point-hexagon">
                            <input type="checkbox" id="hero-point-2">
                            <label for="hero-point-2"></label>
                        </span>
                        <span class="hero-point-hexagon">
                            <input type="checkbox" id="hero-point-3">
                            <label for="hero-point-3"></label>
                        </span>
                    </div>
                    <div id="hero-point-description">
                        <p><span class="strong">Gain 1</span> at the start of each session and when granted by the GM.</p>
                        <p><span class="strong">Spend 1</span> to reroll a check.</p>
                        <p><span class="strong">Spend All</span> to avoid death.</p>
                    </div>
                </div>
            </div>

            <div id="ancestry-block">
                <span class="block-heading">
                    <span class="header-text">Ancestry</span>
                    <span class="header-line"></span>
                </span>
                <span class="container-input">
                    <input type="text">
                </span>
                <span id="heritage-traits-size">
                    <span class="container-input secondary">
                        <span class="assistive-text">Heritage and Traits</span>
                        <input type="text">
                    </span>
                    <span class="container-input secondary">
                        <span class="assistive-text">Size</span>
                        <input type="text">
                    </span>
                </span>
            </div>

            <div id="background-block">
                <span class="block-heading">
                    <span class="header-text">Background</span>
                    <span class="header-line"></span>
                </span>
                <span class="container-input">
                    <input type="text">
                </span>
                <span class="container-input secondary">
                    <span class="assistive-text">Background Notes</span>
                    <input type="text">
                </span>
            </div>

            <div id="class-block">
                <span class="block-heading">
                    <span class="header-text">Class</span>
                    <span class="header-line"></span>
                </span>
                <span class="container-input">
                    <input type="text">
                </span>
                <span class="container-input secondary">
                    <span class="assistive-text">Class Notes</span>
                    <input type="text">
                </span>
            </div>
        </div>
    </page>
</body>

</html>
